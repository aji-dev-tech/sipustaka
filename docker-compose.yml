services:
  web:
    build: .
    container_name: sipustaka-web
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "10.10.10.7:8011:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sipustaka_storage:/var/www/html/storage

  db:
    image: mysql:8.0
    container_name: sipustaka-db
    restart: unless-stopped
    env_file: .env.db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      # Hanya bisa diakses dari server itu sendiri. Untuk akses dari luar, ganti jadi "8010:3306"
      # (dan batasi lewat firewall).
      - "10.10.10.7:8010:3306"
    volumes:
      - sipustaka_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  sipustaka_db:
  sipustaka_storage:
